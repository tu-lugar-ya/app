<style>
:root {
  --noche: #00342E; --aqua: #06F2D5; --menta: #DDF4EE; --bg: #F2F1EC; --card: #FFFFFF; --ink: #0F2522; --muted: #5F716C; --line: #E2E5E0; --soft: #F7F7F3;
  --btn: #00342E; --on-btn: #FFFFFF;
  --st-pend: #A86F00; --st-pend-bg: #FFF1CC; --st-conf: #00796A; --st-conf-bg: #D3F5EF; --st-asis: #1F6B45; --st-asis-bg: #DCEFE3;
  --st-no: #BE3A2E; --st-no-bg: #FBE0DC; --st-rep: #5546C9; --st-rep-bg: #E7E3FF; --st-can: #6F7D79; --st-can-bg: #E9ECEA;
  --wa: #1FA855; --shadow: 0 10px 30px rgba(0, 52, 46, .10);
  --font: "Montserrat", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px);
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0A1412; --card: #13211E; --ink: #E8F1EE; --muted: #97ABA5; --line: #23342F; --soft: #0F1B18; --menta: #12352F; --btn: #0E5247;
    --st-pend: #F2C14E; --st-pend-bg: #3A2F12; --st-conf: #3BE2C8; --st-conf-bg: #0E3A33; --st-asis: #72D49D; --st-asis-bg: #133524;
    --st-no: #FF8E81; --st-no-bg: #3E1A16; --st-rep: #ADA1FF; --st-rep-bg: #261F4D; --st-can: #A3B0AC; --st-can-bg: #1C2A27;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
input, textarea, select { font-size: 16px; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
svg { flex: none; }

.app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; background: var(--bg); overflow: hidden; overflow: clip; }
.top { padding: calc(var(--top) + 10px) var(--gr) 8px var(--gl); display: flex; align-items: center; gap: 8px; background: var(--bg); z-index: 5; }
.marca { font-weight: 800; font-size: 17px; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.marca i { font-style: normal; color: var(--st-conf); }
.marca svg { width: 26px; height: 26px; }
.top .sp { flex: 1; }
.ib { width: 40px; height: 40px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; position: relative; }
.ib svg { width: 20px; height: 20px; }
.ib.girando svg { animation: gira 1s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--st-no); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.yo { width: 40px; height: 40px; border-radius: 50%; background: var(--noche); color: var(--aqua); font-weight: 800; display: grid; place-items: center; font-size: 14px; }

.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 var(--gr) calc(var(--bot) + 104px) var(--gl); }
.h1 { font-size: 29px; font-weight: 800; letter-spacing: -.03em; margin: 4px 0 2px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 24px 0 10px; }
.sec h3 { font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }

.sec button { font-size: 13.5px; font-weight: 700; color: var(--st-conf); }
.stack { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.vacio { background: var(--card); border: 1px dashed var(--line); border-radius: 16px; padding: 16px; color: var(--muted); font-size: 14px; text-align: center; line-height: 1.45; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.p-pend { color: var(--st-pend); background: var(--st-pend-bg); }

.p-asis { color: var(--st-asis); background: var(--st-asis-bg); }
.p-no { color: var(--st-no); background: var(--st-no-bg); }
.p-can { color: var(--st-can); background: var(--st-can-bg); }
.tag { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 8px; background: var(--menta); color: var(--ink); white-space: nowrap; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.next { background: var(--noche); color: #fff; border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); }

.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

a.btn, a.circ { text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: 14px; font-weight: 700; font-size: 14.5px; text-align: center; line-height: 1.2; }
.btn svg { width: 18px; height: 18px; }
.btn.pri { background: var(--aqua); color: #00342E; }
.btn.osc { background: var(--btn); color: var(--on-btn); }
.btn.gh { background: rgba(255,255,255,.12); color: #fff; }
.btn.lin { background: var(--card); border: 1px solid var(--line); color: var(--ink); }
.btn.wa { background: var(--wa); color: #fff; }
.btn.pel { background: var(--st-no-bg); color: var(--st-no); }
.btn.blk { width: 100%; }
.btn.chico { min-height: 38px; font-size: 13px; padding: 0 12px; border-radius: 12px; }
.btn[disabled] { opacity: .55; pointer-events: none; }

.vrow { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; width: 100%; }
.vrow .t { font-weight: 800; font-size: 15px; line-height: 1.1; }
.vrow .t small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 3px; }
.vrow .m b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vrow .m span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.vrow.l-pend { box-shadow: inset 4px 0 0 var(--st-pend); }
.vrow.l-conf { box-shadow: inset 4px 0 0 var(--st-conf); }
.vrow.l-rep { box-shadow: inset 4px 0 0 var(--st-rep); }
.vrow.l-asis { box-shadow: inset 4px 0 0 var(--st-asis); }
.vrow.l-no { box-shadow: inset 4px 0 0 var(--st-no); }
.vrow.l-can { box-shadow: inset 4px 0 0 var(--st-can); }
.vrow.l-can .m b { text-decoration: line-through; color: var(--muted); }

.lead { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.lead .r { display: flex; gap: 12px; align-items: center; }
.lead .r > div { min-width: 0; flex: 1; }
.lead b { display: block; font-size: 15px; }
.lead span.d { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
.av { width: 42px; height: 42px; border-radius: 50%; background: var(--menta); color: var(--st-conf); font-weight: 800; display: grid; place-items: center; flex: none; font-size: 14.5px; }

.mini { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(var(--gr) * -1) 0 calc(var(--gl) * -1); padding: 0 var(--gr) 4px var(--gl); scroll-snap-type: x mandatory; }
.mini::-webkit-scrollbar { display: none; }
.mini button { flex: none; width: 168px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; text-align: left; scroll-snap-align: start; }
.mini .im { aspect-ratio: 3 / 2; background: var(--menta); }
.mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini div.tx { padding: 8px 10px 10px; display: grid; gap: 2px; }
.mini b { font-size: 14px; }
.mini span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { padding: 8px 14px; border-radius: 9px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--btn); color: #fff; }
.calhd { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.calhd .sp { flex: 1; }
.calhd .ib { width: 36px; height: 36px; }
.mes { font-weight: 700; font-size: 15px; text-transform: capitalize; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 12px 0 6px; }
.day { border-radius: 14px; padding: 8px 0 7px; display: grid; justify-items: center; gap: 2px; }
.day small { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.day b { font-size: 18px; font-weight: 800; }
.day .dots { display: flex; gap: 3px; height: 6px; }
.day .dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
.day[aria-pressed="true"] { background: var(--btn); color: #fff; }
.day[aria-pressed="true"] small { color: #A9CFC7; }
.day.hoy:not([aria-pressed="true"]) b { color: var(--st-conf); }
.month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin: 12px 0 6px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 6px; }
.month .hd { font-size: 10.5px; font-weight: 700; color: var(--muted); text-align: center; padding-bottom: 6px; text-transform: uppercase; }
.month .day { padding: 6px 0; border-radius: 10px; }
.month .day b { font-size: 14px; }
.month .day .dots i { width: 5px; height: 5px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
.legend .pill { font-size: 11px; padding: 3px 8px; }
.nota { display: flex; gap: 8px; font-size: 12.5px; color: var(--muted); margin-top: 14px; line-height: 1.45; }
.nota svg { width: 16px; height: 16px; margin-top: 1px; }

.search { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; height: 48px; }
.search svg { width: 18px; height: 18px; color: var(--muted); }
.search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; }
.search button { color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-size: 13.5px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); color: #fff; }
.cuenta { font-size: 13px; color: var(--muted); margin: 12px 2px 0; }
.prop { background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.prop > button { display: block; width: 100%; text-align: left; }
.prop .ph { position: relative; aspect-ratio: 16 / 10; max-width: 100%; background: var(--menta); }
.prop .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.prop .ph .code { position: absolute; left: 12px; top: 12px; background: rgba(0,52,46,.88); color: #fff; font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 8px; letter-spacing: .03em; }
.prop .ph .org { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; }
.prop .ph .org span { background: var(--card); color: var(--ink); font-size: 11.5px; font-weight: 700; padding: 5px 9px; border-radius: 8px; }
.prop .ph .org span.est { background: var(--st-pend-bg); color: var(--st-pend); }
.prop .bd { padding: 12px 14px 0; display: grid; gap: 3px; }
.prop .precio { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.prop .precio small { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
.prop .loc { font-size: 14.5px; font-weight: 600; }
.prop .specs { font-size: 13px; color: var(--muted); }
.prop .acc { padding: 10px 14px 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.prop .acc .btn { flex: 1; min-height: 40px; font-size: 13.5px; padding: 0 10px; }
.sirve { font-size: 12.5px; font-weight: 700; color: var(--st-conf); margin-top: 4px; }
.ph0 { width: 100%; height: 100%; display: grid; place-items: center; color: var(--st-conf); background: var(--menta); }
.ph0 svg { width: 40px; height: 40px; opacity: .55; }

.atras { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--st-conf); font-size: 15px; margin: 2px 0 8px; min-height: 36px; }
.atras svg { width: 18px; height: 18px; }
.gal { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 20px; scrollbar-width: none; background: var(--menta); }
.gal::-webkit-scrollbar { display: none; }
.gal img, .gal .ph0 { flex: none; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; scroll-snap-align: start; display: block; }
.galn { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: right; }
.fhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-top: 12px; }
.fhead h2 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; }
.fhead .precio { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin-top: 6px; }
.fhead .precio small { display: block; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: 0; margin-top: 2px; }
.kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.kv div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-width: 0; }
.kv small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
.kv b { font-size: 16px; font-weight: 800; }
.caja { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 14px; }
.caja.menta { background: var(--menta); border-color: transparent; }
.caja .tit { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 0 2px; }
.fila { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.caja.menta .fila { border-color: rgba(0,52,46,.1); }
.fila:last-child { border-bottom: 0; }
.fila > span { color: var(--muted); flex: none; }
.fila > b { text-align: right; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.fila .accs { display: flex; gap: 6px; }
.circ { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); color: var(--ink); }
.circ.wa { background: var(--wa); border-color: var(--wa); color: #fff; }
.circ svg { width: 17px; height: 17px; }
.texto { font-size: 13.5px; line-height: 1.5; white-space: pre-line; color: var(--ink); padding: 8px 0 12px; }
.acciones { display: grid; gap: 8px; margin-top: 16px; }

.cli { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; }
.cli > div { min-width: 0; flex: 1; }
.cli b { display: block; font-size: 15px; }
.cli div span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tabbar { position: absolute; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 8px var(--gr) calc(var(--bot) + 8px) var(--gl); display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; z-index: 20; }
.tab { display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { color: var(--st-conf); }
.mas { justify-self: center; width: 56px; height: 56px; border-radius: 18px; background: var(--noche); color: var(--aqua); display: grid; place-items: center; margin-top: -24px; box-shadow: 0 8px 20px rgba(0,52,46,.35); }
.mas svg { width: 26px; height: 26px; }

.velo { position: absolute; inset: 0; background: rgba(5, 20, 18, .45); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 30; }
.velo.on { opacity: 1; pointer-events: auto; }
.hoja { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - var(--top) - 24px); background: var(--bg); border-radius: 24px 24px 0 0; transform: translateY(105%); visibility: hidden; transition: transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s linear .32s; z-index: 31; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
.hoja.on { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2,.8,.2,1); }
.hoja .agarre { padding: 8px 0 4px; display: flex; justify-content: center; position: relative; flex: none; }
.hoja .agarre i { width: 40px; height: 5px; border-radius: 3px; background: var(--line); }
.hoja .cerrar { position: absolute; right: var(--gr); top: 8px; width: 32px; height: 32px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; }
.hoja .cerrar svg { width: 16px; height: 16px; }
.hoja .in { overflow-y: auto; padding: 4px var(--gr) calc(var(--bot) + 24px) var(--gl); -webkit-overflow-scrolling: touch; }
.hoja h2 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; margin: 4px 44px 4px 0; }
.hoja .lede { color: var(--muted); font-size: 14px; margin: 0 0 14px; line-height: 1.45; }
.campo { display: grid; gap: 6px; margin-bottom: 14px; }
.campo > label, .campo > .lab { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.inp, textarea, select.inp { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 11px 12px; outline: 0; resize: vertical; min-height: 46px; }
